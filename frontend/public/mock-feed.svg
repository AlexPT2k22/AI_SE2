<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d2d3d"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#sky)"/>
  <rect y="480" width="1280" height="240" fill="url(#ground)"/>
  <line x1="0" y1="480" x2="1280" y2="480" stroke="#4a4a5a" stroke-width="2"/>

  <!-- Parking spots -->
  <g stroke="white" stroke-width="2" fill="none">
    <!-- Row 1 -->
    <rect x="100" y="500" width="120" height="180" rx="4" fill="rgba(34,197,94,0.2)" stroke="#22c55e"/>
    <rect x="260" y="500" width="120" height="180" rx="4" fill="rgba(239,68,68,0.2)" stroke="#ef4444"/>
    <rect x="420" y="500" width="120" height="180" rx="4" fill="rgba(99,102,241,0.2)" stroke="#6366f1"/>
    <rect x="620" y="500" width="120" height="180" rx="4" fill="rgba(239,68,68,0.2)" stroke="#ef4444"/>
    <rect x="820" y="500" width="120" height="180" rx="4" fill="rgba(34,197,94,0.2)" stroke="#22c55e"/>
    <rect x="980" y="500" width="120" height="180" rx="4" fill="rgba(239,68,68,0.2)" stroke="#ef4444"/>
  </g>

  <!-- Spot labels -->
  <text x="160" y="610" text-anchor="middle" fill="white" font-size="18" font-family="monospace" font-weight="bold">A1</text>
  <text x="320" y="610" text-anchor="middle" fill="white" font-size="18" font-family="monospace" font-weight="bold">A2</text>
  <text x="480" y="610" text-anchor="middle" fill="white" font-size="18" font-family="monospace" font-weight="bold">A3</text>
  <text x="680" y="610" text-anchor="middle" fill="white" font-size="18" font-family="monospace" font-weight="bold">B1</text>
  <text x="880" y="610" text-anchor="middle" fill="white" font-size="18" font-family="monospace" font-weight="bold">B2</text>
  <text x="1040" y="610" text-anchor="middle" fill="white" font-size="18" font-family="monospace" font-weight="bold">B3</text>

  <!-- Car icons in occupied spots -->
  <g transform="translate(310, 560)">
    <rect x="-25" y="-12" width="50" height="24" rx="6" fill="#ef4444" opacity="0.9"/>
    <rect x="-15" y="-8" width="30" height="16" rx="4" fill="#dc2626"/>
    <circle cx="-12" cy="14" r="5" fill="#111"/>
    <circle cx="12" cy="14" r="5" fill="#111"/>
  </g>
  <g transform="translate(670, 560)">
    <rect x="-25" y="-12" width="50" height="24" rx="6" fill="#ef4444" opacity="0.9"/>
    <rect x="-15" y="-8" width="30" height="16" rx="4" fill="#dc2626"/>
    <circle cx="-12" cy="14" r="5" fill="#111"/>
    <circle cx="12" cy="14" r="5" fill="#111"/>
  </g>
  <g transform="translate(1030, 560)">
    <rect x="-25" y="-12" width="50" height="24" rx="6" fill="#ef4444" opacity="0.9"/>
    <rect x="-15" y="-8" width="30" height="16" rx="4" fill="#dc2626"/>
    <circle cx="-12" cy="14" r="5" fill="#111"/>
    <circle cx="12" cy="14" r="5" fill="#111"/>
  </g>

  <!-- Overlay text -->
  <rect x="440" y="40" width="400" height="50" rx="8" fill="rgba(0,0,0,0.6)"/>
  <text x="640" y="72" text-anchor="middle" fill="#22c55e" font-size="20" font-family="monospace" font-weight="bold">MOCK VIDEO FEED</text>
  <text x="640" y="110" text-anchor="middle" fill="#888" font-size="14" font-family="monospace">Demo Mode - No Camera Connected</text>

  <!-- Legend -->
  <g transform="translate(440, 140)">
    <rect x="0" y="0" width="200" height="80" rx="8" fill="rgba(0,0,0,0.5)"/>
    <rect x="10" y="10" width="16" height="16" rx="2" fill="rgba(34,197,94,0.3)" stroke="#22c55e" stroke-width="1"/>
    <text x="34" y="23" fill="white" font-size="12" font-family="monospace">Available</text>
    <rect x="10" y="32" width="16" height="16" rx="2" fill="rgba(239,68,68,0.3)" stroke="#ef4444" stroke-width="1"/>
    <text x="34" y="45" fill="white" font-size="12" font-family="monospace">Occupied</text>
    <rect x="10" y="54" width="16" height="16" rx="2" fill="rgba(99,102,241,0.3)" stroke="#6366f1" stroke-width="1"/>
    <text x="34" y="67" fill="white" font-size="12" font-family="monospace">Reserved</text>
  </g>

  <!-- Timestamp -->
  <text x="1270" y="710" text-anchor="end" fill="#555" font-size="11" font-family="monospace">MOCK</text>
</svg>
